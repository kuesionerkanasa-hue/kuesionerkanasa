<style>
/* ============================================================
   FAIRYCORE TOKENS
   ============================================================ */
:root{
  --krem:#FAF7F2; --susu:#FFFDF9; --sage:#B7D3B0; --mint:#E4F1E1;
  --blush:#E8B7CE; --lavender:#C9B5E8; --butter:#F6D58A; --clay:#F3C9A8;
  --tinta:#342744; --tinta-2:#4E3F5E; --tinta-3:#6F6475;
  --ungu:#8B6BB1; --hijau-tua:#5E7F57; --mawar:#C97FA0;
  --garis:#DDCFE5; --kartu:#FFFDF9; --panel:#F6F1F8;
  --ok:#5C7A57; --warn:#B4802F; --bad:#C1586B;
  --r-l:28px; --r-m:18px; --r-s:12px;
  --shadow-s:0 8px 25px rgba(70,50,90,.06);
  --shadow-m:0 14px 34px rgba(70,50,90,.12);
  --shadow-g:0 0 0 4px rgba(201,181,232,.4);
  --maxw:1120px;
  --bg:#FAF7F2; --surface:#FFFDF9; --surface-soft:#F6F1F8;
  --primary:#8B6BB1; --primary-hover:#74579A; --secondary:#C9B5E8;
  --accent-pink:#E8B7CE; --accent-green:#B7D3B0; --accent-yellow:#F6D58A; --accent-peach:#F3C9A8;
  --text:#342744; --text-muted:#6F6475; --border:#DDCFE5;
  --danger:#C1586B; --success:#5E7F57;
  --deep:#39294F; --green-deep:#4F6C4A; --rose-deep:#A8566F;
  --soft-green:#E6F1E2; --soft-pink:#FBEAF0; --soft-yellow:#FBF0D6; --soft-purple:#EFE7FA;
  --blur-bg:rgba(250,247,242,.92);
  --radius-sm:12px; --radius-md:18px; --radius-lg:24px;
  --shadow-sm:0 8px 25px rgba(70,50,90,.06); --shadow-md:0 14px 34px rgba(70,50,90,.12);
  --content-width:1180px; --section-gap:clamp(32px,5vw,72px);
  --fs-serif:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-hand:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --krem:#241C33; --susu:#2E2542; --sage:#89A883; --mint:#334A3B;
    --blush:#6F4B5D; --lavender:#5C4E7E; --butter:#6E5E37; --clay:#463A52;
    --tinta:#F3ECFA; --tinta-2:#D3C6E2; --tinta-3:#A79AB9;
    --ungu:#C9B5E8; --hijau-tua:#B7D3B0; --mawar:#E8B7CE;
    --garis:#453A5C; --kartu:#2E2542; --panel:#281F3A;
    --bg:#241C33; --surface:#2E2542; --surface-soft:#281F3A;
    --primary:#C9B5E8; --primary-hover:#DCCBF3; --secondary:#5C4E7E;
    --accent-pink:#C98CA6; --accent-green:#89A883; --accent-yellow:#E7CE94;
    --text:#F3ECFA; --text-muted:#A79AB9; --border:#453A5C;
    --deep:#F3ECFA; --green-deep:#B7D3B0; --rose-deep:#EFB4C7;
    --soft-green:#2F4436; --soft-pink:#4A3040; --soft-yellow:#453A26; --soft-purple:#3A3054;
    --blur-bg:rgba(36,28,51,.92);
    --shadow-s:0 2px 10px rgba(0,0,0,.35);
    --shadow-m:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --krem:#241C33; --susu:#2E2542; --sage:#89A883; --mint:#334A3B;
  --blush:#6F4B5D; --lavender:#5C4E7E; --butter:#6E5E37; --clay:#463A52;
  --tinta:#F3ECFA; --tinta-2:#D3C6E2; --tinta-3:#A79AB9;
  --ungu:#C9B5E8; --hijau-tua:#B7D3B0; --mawar:#E8B7CE;
  --garis:#453A5C; --kartu:#2E2542; --panel:#281F3A;
  --bg:#241C33; --surface:#2E2542; --surface-soft:#281F3A;
  --primary:#C9B5E8; --primary-hover:#DCCBF3; --secondary:#5C4E7E;
  --accent-pink:#C98CA6; --accent-green:#89A883; --accent-yellow:#E7CE94;
  --text:#F3ECFA; --text-muted:#A79AB9; --border:#453A5C;
  --deep:#F3ECFA; --green-deep:#B7D3B0; --rose-deep:#EFB4C7;
  --soft-green:#2F4436; --soft-pink:#4A3040; --soft-yellow:#453A26; --soft-purple:#3A3054;
  --blur-bg:rgba(36,28,51,.92);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--krem);color:var(--tinta);
  font-family:var(--fs-body);font-size:16px;line-height:1.65;
  min-height:100vh;overflow-x:hidden;
}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--fs-serif);font-weight:700;line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.5vw,3.4rem)}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem)}
h3{font-size:clamp(1.15rem,2.2vw,1.45rem)}
p{margin:0 0 1em;max-width:72ch}
a{color:var(--ungu)}
:focus-visible{outline:3px solid var(--ungu);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Dekorasi */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dust{position:fixed;display:block;background:var(--c,#C9B5E8);border-radius:50%;opacity:0;
  animation:dustTwinkle var(--dur,5s) ease-in-out infinite;animation-delay:var(--d,0s)}
.dust.star{border-radius:0;clip-path:polygon(50% 0%,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0% 50%,41% 41%)}
@keyframes dustTwinkle{0%,100%{opacity:0;transform:scale(.6)} 50%{opacity:.32;transform:scale(1) translateY(-7px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-22px) rotate(4deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.25)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s ease both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* Komponen Kartu & Tombol */
.card{background:var(--kartu);border-radius:var(--r-l);padding:26px;box-shadow:var(--shadow-s);border:1px solid var(--garis);position:relative}
.card.soft{background:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;
  font-family:var(--fs-body);font-weight:700;font-size:1rem;
  padding:13px 26px;border-radius:999px;border:0;cursor:pointer;
  background:var(--ungu);color:#fff;box-shadow:var(--shadow-s);
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(122,98,148,.28),0 0 22px rgba(207,192,232,.5)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ungu);border:2px solid var(--lavender);box-shadow:none}
.btn.ghost:hover{background:var(--lavender);color:var(--tinta)}
.btn.leaf{background:var(--hijau-tua)}
.btn.rose{background:var(--mawar)}
.btn.sm{padding:8px 16px;font-size:.88rem}
.btn.xs{padding:5px 12px;font-size:.78rem;border-radius:10px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--mint);color:var(--hijau-tua)}
.chip.lav{background:var(--lavender);color:var(--ungu)}
.chip.rose{background:var(--blush);color:var(--mawar)}
.chip.butter{background:var(--butter);color:var(--warn)}
.chip.grey{background:var(--garis);color:var(--tinta-2)}

/* Status Sinkronisasi Auto-Save */
.savestate{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;transition:all .3s ease}
.savestate.saved{background:var(--soft-green);color:var(--green-deep)}
.savestate.saving,.savestate.syncing{background:var(--soft-yellow);color:var(--warn)}
.savestate.err{background:var(--soft-pink);color:var(--rose-deep);cursor:pointer}
.savestate.offline,.savestate.local{background:var(--soft-purple);color:var(--primary)}

/* Banner Pemulihan Draft */
.recovery-banner{background:var(--soft-purple);border:1px solid var(--secondary);border-radius:var(--radius-md);
  padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.recovery-banner strong{color:var(--deep);font-size:.95rem}
.recovery-banner p{margin:0;font-size:.86rem;color:var(--text)}

/* Kuesioner */
.q-head{position:sticky;top:0;z-index:30;background:var(--blur-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 0}
.q-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.q-meta .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-crumb{font-size:.82rem;font-weight:700;color:var(--primary)}
.q-count{font-size:.76rem;font-weight:600;color:var(--text-muted)}
.cfgwarn{background:var(--soft-yellow);color:var(--warn);font-weight:700;font-size:.82rem;text-align:center;padding:9px 16px;position:relative;z-index:5}
.cfgwarn code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px}

.trackwrap{position:relative;padding-top:12px}
.bar{height:10px;background:var(--border);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent-green),var(--accent-pink),var(--secondary));transition:width .45s ease}
.marker{position:absolute;top:0;width:26px;transform:translateX(-50%);pointer-events:none;
  transition:left .45s cubic-bezier(.2,.8,.3,1);filter:drop-shadow(0 2px 4px rgba(70,50,90,.2))}

.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 20px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:border-color .25s ease,box-shadow .25s ease}
.qcard:focus-within{border-color:var(--secondary)}
.qcard.answered{border-color:var(--accent-green)}
.qcard.invalid{border-color:var(--danger);background:var(--soft-pink)}
.qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.qnum{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-width:44px;height:26px;padding:0 10px;border-radius:999px;background:var(--soft-green);
  color:var(--green-deep);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.qcard.answered .qnum{background:var(--accent-green);color:#2F4436}
.qtext{font-weight:500;font-size:.98rem;line-height:1.55;margin:0}
.qcue{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 6px;border-radius:999px;
  background:var(--surface-soft);border:1px solid var(--border);font-size:.73rem;
  color:var(--text-muted);font-weight:600;margin:0 0 12px 56px}

.likert{display:flex;gap:8px;justify-content:space-between;margin-left:56px}
.likert label{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;cursor:pointer;min-height:64px;padding:10px 2px 8px;
  border-radius:var(--radius-md);border:2px solid var(--border);background:var(--surface-soft);
  transition:transform .2s ease,border-color .2s ease,background .2s ease}
.likert .emo{font-size:clamp(1.5rem,4.6vw,1.85rem);line-height:1;filter:grayscale(.5);opacity:.72;transition:.2s ease}
.likert .kode{font-size:.68rem;font-weight:700;color:var(--text-muted);letter-spacing:.04em}
.likert label:hover{transform:translateY(-2px) scale(1.08);border-color:var(--secondary);z-index:2}
.likert label:hover .emo{filter:none;opacity:1}
.likert label:has(input:checked){border-color:var(--primary);background:var(--soft-purple);transform:scale(1.08);z-index:2}
.likert label:has(input:checked) .emo{filter:none;opacity:1}
.likert label:has(input:checked) .kode{color:var(--primary)}
.likert input{position:absolute;opacity:0;width:0;height:0}

.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);
  border:2px solid var(--border);min-height:48px;background:var(--surface-soft);cursor:pointer;margin-bottom:8px;font-weight:500;transition:.18s ease}
.opt:hover{border-color:var(--secondary);transform:translateX(2px)}
.opt:has(input:checked){border-color:var(--primary);background:var(--soft-purple)}
.opt input{accent-color:var(--ungu);width:18px;height:18px;flex:0 0 auto}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;font-family:var(--fs-body);font-size:1rem;color:var(--tinta);
  padding:11px 14px;border-radius:14px;border:2px solid var(--garis);background:var(--susu);transition:.16s}
input:focus,select:focus,textarea:focus{border-color:var(--lavender);outline:none;box-shadow:var(--shadow-g)}

/* Navigasi */
.nav-row{display:flex;gap:12px;justify-content:space-between;margin-top:26px;flex-wrap:wrap}
.theme-toggle{width:38px;height:38px;flex:0 0 auto;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .2s ease,background .2s ease}

/* Admin Dashboard */
.admin{display:grid;grid-template-columns:262px 1fr;min-height:100vh;position:relative;z-index:1}
.side{background:var(--panel);border-right:1px solid var(--garis);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side nav a{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:12px;
  color:var(--tinta-2);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:2px;cursor:pointer}
.side nav a:hover{background:var(--mint);color:var(--hijau-tua)}
.side nav a.on{background:var(--lavender);color:var(--ungu)}
.side .grp{font-size:.7rem;font-weight:700;color:var(--tinta-3);padding:12px 12px 4px;letter-spacing:.06em}
.main{padding:24px 26px 70px;min-width:0}
.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.kpi{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm)}
.kpi .ic{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;background:var(--surface-soft);border:1px solid var(--border)}
.kpi .n{display:block;font-size:1.8rem;font-weight:800;color:var(--deep);line-height:1.05}
.kpi .l{display:block;font-size:.76rem;color:var(--text-muted);font-weight:600;margin-top:3px}
.tablewrap{overflow-x:auto;border-radius:var(--r-m);border:1px solid var(--garis);background:var(--kartu)}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:520px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--garis);white-space:nowrap;vertical-align:top}
th{background:var(--panel);font-weight:700;color:var(--tinta-2);position:sticky;top:0}
tbody tr:hover{background:var(--surface-soft)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--soft-green);color:var(--green-deep)}
.badge.bad{background:var(--soft-pink);color:var(--rose-deep)}
.badge.warn{background:var(--soft-yellow);color:var(--warn)}
.badge.mute{background:var(--surface-soft);color:var(--text-muted)}

/* Landing Page Styles */
.lp-hero{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,64px) 22px clamp(30px,5vw,56px);
  display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:clamp(20px,4vw,52px);align-items:center}
.lp-cta{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem;
  padding:11px 20px;border-radius:14px;background:var(--ungu);color:#fff;border:2px solid #74579A;text-decoration:none;cursor:pointer}
.lp-sec{max-width:1180px;margin:0 auto;padding:clamp(26px,4vw,46px) 22px}
.lp-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.lp-card{position:relative;background:var(--kartu);border:1px solid var(--garis);border-radius:20px;padding:26px 28px;box-shadow:0 8px 25px rgba(70,50,90,.06)}

/* Toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--tinta);color:var(--susu);padding:12px 20px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow-m)}
.toast.ok{background:var(--hijau-tua)} .toast.bad{background:var(--bad)}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(36,20,50,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-md);max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
</style>
</head>

function tglID(iso){ if(!iso) return "–"; const d=new Date(iso);

function durasi(ms){ if(!ms) return "–"; const s=Math.round(ms/1000); return Math.floor(s/60)+"m "+(s%60)+"s"; }

function uuid4(){
  if(crypto && crypto.randomUUID){ try{ return crypto.randomUUID(); }catch(e){} }
  const b = new Uint8Array(16);
  (crypto && crypto.getRandomValues) ? crypto.getRandomValues(b)
    : b.forEach((_,i)=>b[i]=Math.floor(Math.random()*256));
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=[...b].map(x=>x.toString(16).padStart(2,"0"));
  return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+"-"+
         h.slice(8,10).join("")+"-"+h.slice(10,16).join("");
}

function klasifikasiError(err){
  const m = String((err && (err.message||err.msg)) || err || "");
  const kode = err && (err.code||err.status);
  if(typeof navigator!=="undefined" && navigator.onLine===false){
    return { tipe:"network", pesan:"Tidak ada koneksi. Data tetap aman di perangkat." };
  }
  if(kode==="42501"||/row-level security|permission denied|violates row-level/i.test(m)){
    return { tipe:"rls", pesan:"Data tersimpan di perangkat, tetapi server menolak sinkronisasi. Sistem akan mencoba lagi." };
  }
  if(kode==="PGRST301"||kode===401||/JWT|jwt expired|invalid token/i.test(m)){
    return { tipe:"auth", pesan:"Sesi otentikasi tidak valid atau telah berakhir." };
  }
  if(kode==="23502"||/not-null/i.test(m)){
    return { tipe:"validation", pesan:"Terdapat isian wajib yang belum lengkap." };
  }
  if(/Failed to fetch|NetworkError|Load failed|Batas waktu/i.test(m)){
    return { tipe:"network", pesan:"Tidak ada koneksi. Data tetap aman di perangkat." };
  }
  return { tipe:"unknown", pesan:"Sinkronisasi tertunda: " + (m.slice(0,80) || "gangguan jaringan.") };
}

async function supabaseRequest(label, bangun, opsi){
  opsi = opsi || {};
  if(!DB.siap){ const e=new Error("Database belum dikonfigurasi."); e.takSiap=true; throw e; }
  const batas = opsi.timeout || CONFIG.REQUEST_TIMEOUT_MS;
  const ulang = opsi.ulang==null ? 2 : opsi.ulang;
  let terakhir=null;
  for(let i=0;i<=ulang;i++){
    try{
      const hasil = await Promise.race([
        Promise.resolve().then(()=>bangun(DB.client)),
        new Promise((_,tolak)=>setTimeout(()=>tolak(new Error("Batas waktu permintaan terlampaui")),batas))
      ]);
      if(hasil && hasil.error) throw Object.assign(new Error(hasil.error.message||"Galat database"), hasil.error);
      return hasil && "data" in hasil ? hasil.data : hasil;
    }catch(e){
      terakhir=e;
      const c = klasifikasiError(e);
      if(c.tipe==="rls" || c.tipe==="auth" || i===ulang) break;
      await sleep(400*(i+1));
    }
  }
  console.warn("[Supabase · "+label+"]", terakhir);
  const info = klasifikasiError(terakhir);
  const e = new Error(info.pesan);
  e.tipe = info.tipe; e.asli = terakhir; e.label = label;
  throw e;
}

const DB = {

  init(){

    this.client = window.supabase.createClient(
      String(CONFIG.SUPABASE_URL).trim().replace(/\/+$/,""),

      { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, storageKey:"kuesioner-auth" },
        global:{ headers:{ "x-respondent-code": Ident.kode } } });
    this.siap = true;
    return true;
  },
  async semua(tabel, kolom, susun){
    const out=[], per=1000;
    for(let dari=0; ; dari+=per){
      const bagian = await supabaseRequest("baca:"+tabel, c=>{
        let q = c.from(tabel).select(kolom);
        if(susun) q = susun(q);
        return q.range(dari, dari+per-1);
      });
      const arr = bagian||[];
      out.push(...arr);
      if(arr.length < per || dari > 200000) break;
    }
    return out;
  }
};

const SyncLog = {
  KEY:"log_sinkronisasi",
  semua(){ return LS.get(this.KEY, []); },
  catat(responseId, operasi, status, detail=""){
    const list = this.semua();
    list.unshift({ waktu: new Date().toISOString(), responseId, operasi, status, detail });
    if(list.length > 50) list.pop();

};

const Antrian = {
  KEY:"antrian_sinkron",
  timerRetry:null,
  ambil(){ const a=LS.get(this.KEY,[]); return Array.isArray(a)?a:[]; },
  simpan(a){ LS.set(this.KEY,a); },
  get jumlah(){ return this.ambil().length; },
  tambah(tugas){
    const a=this.ambil();
    const i=a.findIndex(x=>x.k===tugas.k);
    if(i>=0) a[i]=tugas; else a.push(tugas);
    this.simpan(a);
    Status.tersimpanDiPerangkat();
  },
  async alirkan(){
    if(!DB.siap || !navigator.onLine) {
      if(this.jumlah > 0) Status.tersimpanDiPerangkat();
      return false;
    }
    let a=this.ambil();
    if(!a.length){
      Status.tersimpan();
      return true;
    }
    Status.menunggu("🟡 Sedang menyinkronkan...");
    const sisa=[];
    let berhasilCount = 0;

    for(const t of a){
      try{
        if(t.jenis==="answer"){
          await supabaseRequest("antrean:answer", c=>c.from("survey_answers")
            .upsert(t.baris,{onConflict:"response_id,question_id"}), {ulang:1});
        } else if(t.jenis==="profile"){
          await supabaseRequest("antrean:profile", c=>c.from("respondent_profiles")
            .upsert(t.baris,{onConflict:"response_id"}), {ulang:1});
        } else if(t.jenis==="response_progress"){
          await supabaseRequest("antrean:progress", c=>c.from("survey_responses")
            .update({ progress: t.progress, last_sync_at: new Date().toISOString() }).eq("id", t.id), {ulang:1});
        }
        berhasilCount++;
        SyncLog.catat(t.response_id||t.id, t.jenis, "Sukses");
      }catch(e){
        sisa.push(t);
        SyncLog.catat(t.response_id||t.id, t.jenis, "Gagal", e.message);
      }
    }
    this.simpan(sisa);
    if(!sisa.length){
      Status.sinkronSukses();
      // Periksa apakah auto-finalize siap dijalankan
      if(AppConfig.get().auto_finalize_mode){
        await Respon.cobaAutoFinalisasi();
      }
      return true;
    } else {
      const errTerkini = klasifikasiError(sisa[0].asli || "Error");
      if(errTerkini.tipe === "rls") Status.gagal("🔴 Server menolak sinkronisasi");
      else Status.tersimpanDiPerangkat();
      return false;
    }
  },
  mulaiLoopRetry(){
    if(this.timerRetry) clearInterval(this.timerRetry);
    const cfg = AppConfig.get();
    if(!cfg.auto_retry_mode) return;
    const intervalMs = Math.max(10, cfg.auto_retry_interval_sec || 30) * 1000;
    this.timerRetry = setInterval(()=>{
      if(Antrian.jumlah > 0 && navigator.onLine){
        Antrian.alirkan();
      }
    }, intervalMs);
  }
};

const Respon = {

  terkirim: false,
  _tunda: {},
  _timer: null,

      try{
        const ada = await supabaseRequest("cek-draft", c=>c.from("survey_responses")
          .select("id,started_at,status,progress").eq("respondent_code", this.kode).maybeSingle(), {ulang:1});
        if(ada){
          this.id = ada.id;
          this.mulaiAt = ada.started_at ? new Date(ada.started_at).getTime() : Date.now();
          this.terkirim = ada.status === "submitted";
          this.progress = ada.progress || this.progress;
          return this.id;
        }
      }catch(e){ console.warn("Pencarian draft server tertunda.", e); }
    }

    // 3. Buat draft baru yang idempoten
    const baruId = uuid4();
    this.id = baruId;
    this.mulaiAt = Date.now();
    if(DB.siap){
      try{
        await supabaseRequest("buat-draft", c=>c.from("survey_responses").insert({
          id: baruId, respondent_code: this.kode, started_at: new Date(this.mulaiAt).toISOString(),
          status: "draft", progress: this.progress, auto_saved: true
        }), {ulang:1});
        SyncLog.catat(baruId, "buat_draft", "Sukses");
      }catch(e){
        Antrian.tambah({ jenis:"response_create", id:baruId, k:"resp|"+baruId, baris:{ id:baruId, respondent_code:this.kode } });
        SyncLog.catat(baruId, "buat_draft", "Offline / Tertunda", e.message);
      }
    }
    return this.id;
  },

  async muatDraft(){
    const cermin = LS.get("draft_kuesioner", {}) || {};
    let data = cermin.data || {};
    let progress = { step: cermin.step||0, setuju: !!cermin.setuju };
    let mulaiAt = cermin.mulaiAt || null;
    let ditemukan = false;

    if(DB.siap){
      try{
        await this.pastikanDraft();
        if(this.id){
          const baris = await DB.semua("survey_answers", "question_id,answer_value,answer_numeric,answer_text", q=>q.eq("response_id", this.id));
          if(baris && baris.length){
            data = Object.assign({}, data, PETA.keData(baris));
            ditemukan = true;
          }
        }
      }catch(e){ console.warn("Memulihkan dari cadangan lokal perangkat.", e); }
    }
    if(!ditemukan && Object.keys(data).length > 0) ditemukan = true;
    return { data, step: progress.step, setuju: progress.setuju, mulaiAt, ditemukan };
  },

  cerminkan(data, step, setuju, mulaiAt){
    LS.set("draft_kuesioner", { data, step, setuju, mulaiAt, kode:this.kode, response_id:this.id });
  },

  antre(qid, nilai, data){
    const cfg = AppConfig.get();
    if(!cfg.auto_save_mode) return;

    this._tunda[qid] = { nilai, data };
    Status.menunggu("🟡 Menyimpan draft...");
    clearTimeout(this._timer);
    this._timer = setTimeout(()=>this.kirimTertunda(), CONFIG.AUTOSAVE_DEBOUNCE_MS);
  },

  async kirimTertunda(){
    const paket = this._tunda;
    this._tunda = {};
    const kunci = Object.keys(paket);
    if(!kunci.length) return;

    if(!DB.siap){
      Status.tersimpanDiPerangkat();
      return;
    }

    try{ await this.pastikanDraft(); }catch(e){}
    if(!this.id){
      Status.tersimpanDiPerangkat();
      return;
    }

    const baris = kunci.map(q=>PETA.keBaris(this.id, q, paket[q].nilai, paket[q].data));
    try{
      await supabaseRequest("autosave-jawaban", c=>c.from("survey_answers")
        .upsert(baris, { onConflict:"response_id,question_id" }), {ulang:1});

      // Update profil demografi jika ada perubahan data demografi
      if(kunci.some(k=>/^D\d+$/.test(k))){
        await this.simpanProfil(AppView.state.data);
      }

      if(Antrian.jumlah > 0) await Antrian.alirkan();
      else Status.tersimpan();

      SyncLog.catat(this.id, "autosave_batch", "Sukses", `${baris.length} item`);

      // Cek apakah siap auto-finalize
      if(AppConfig.get().auto_finalize_mode){
        await this.cobaAutoFinalisasi();
      }
    }catch(e){
      baris.forEach(b=>{
        Antrian.tambah({ jenis:"answer", k:b.response_id+"|"+b.question_id, baris:b, response_id:b.response_id });
      });
      Status.tersimpanDiPerangkat();
      SyncLog.catat(this.id, "autosave_batch", "Gagal/Offline", e.message);
    }
  },

  async simpanProfil(data){
    if(!DB.siap || !this.id) return;
    const baris = PETA.keProfil(this.id, data);
    try{
      await supabaseRequest("simpan-profil", c=>c.from("respondent_profiles")
        .upsert(baris, { onConflict:"response_id" }), {ulang:1});
    }catch(e){
      Antrian.tambah({ jenis:"profile", k:"profile|"+this.id, baris, response_id:this.id });
    }
  },

  async simpanProgress(step, setuju){
    this.progress = { step, setuju:!!setuju };
    if(!DB.siap || !this.id) return;
    try{
      await supabaseRequest("progress", c=>c.from("survey_responses")
        .update({ progress:this.progress, last_sync_at:new Date().toISOString() }).eq("id", this.id), {ulang:0});
    }catch(e){
      Antrian.tambah({ jenis:"response_progress", id:this.id, k:"prog|"+this.id, progress:this.progress, response_id:this.id });
    }
  },

  cekKelengkapan(data){
    data = data || (AppView.state && AppView.state.data) || {};
    // 1. Semua Likert P1-P29 harus terisi valid 1..5
    const likertLengkap = ITEMS.every(it => {
      const v = Number(data[it]);
      return isFinite(v) && v >= 1 && v <= 5;
    });
    // 2. Demografi wajib
    const demoWajib = ["D1","D2","D3","D4","D5","D6","D7","D8","D9","D10"];
    const demoLengkap = demoWajib.every(d => String(data[d]||"").trim().length > 0);
    // 3. Persetujuan responden
    const setujuLengkap = !!this.progress.setuju;

    return likertLengkap && demoLengkap && setujuLengkap;
  },

  async cobaAutoFinalisasi(){
    if(!AppConfig.get().auto_finalize_mode) return false;
    if(this.terkirim) return true;

    // Hanya jika benar-benar lengkap
    if(!this.cekKelengkapan()){
      return false;
    }

    // Hanya jika antrean lokal sudah kosong
    if(Antrian.jumlah > 0){
      Status.menunggu("Menunggu sinkronisasi selesai sebelum kuesioner difinalisasi.");
      return false;
    }

    try{
      await this.submit(AppView.state.data, Date.now() - (this.mulaiAt||Date.now()), true);
      return true;
    }catch(e){
      console.warn("Auto-finalize ditunda karena error sync.", e);
      return false;
    }
  },

  async submit(data, durasiMs, isAuto=false){
    if(!this.cekKelengkapan(data)){
      throw new Error("Masih ada bagian yang belum lengkap. Jawaban Anda tetap aman tersimpan sebagai draft.");
    }

    clearTimeout(this._timer);
    await this.kirimTertunda();
    const suksesAlir = await Antrian.alirkan();
    if(!suksesAlir || Antrian.jumlah > 0){
      throw new Error("Menunggu sinkronisasi selesai sebelum kuesioner difinalisasi.");
    }

    await this.pastikanDraft();
    const baris = ITEMS.map(it=>PETA.keBaris(this.id, it, data[it], data));
    await supabaseRequest("submit-jawaban", c=>c.from("survey_answers").upsert(baris, { onConflict:"response_id,question_id" }));
    await supabaseRequest("submit-profil", c=>c.from("respondent_profiles").upsert(PETA.keProfil(this.id, data), { onConflict:"response_id" }));
    await supabaseRequest("submit-final", c=>c.from("survey_responses").update({
      status: "submitted",
      submitted_at: new Date().toISOString(),
      duration_ms: durasiMs || null,
      last_sync_at: new Date().toISOString()
    }).eq("id", this.id));

    this.terkirim = true;
    SyncLog.catat(this.id, isAuto ? "auto_finalize" : "submit_manual", "Sukses");
    LS.del("draft_kuesioner");
    return { ok:true, id:this.id };
  }
};

const Auth = {
  sesi:null, user:null, peran:null,
  async sesiAktif(){
    if(!DB.siap) return null;
    const { data } = await DB.client.auth.getSession();
    return (data && data.session && !data.session.user.is_anonymous) ? data.session : null;
  },
  async masuk(sandi){
    const email = String(CONFIG.ADMIN_EMAIL||"").trim();
    const r = await DB.client.auth.signInWithPassword({ email, password:sandi });
    if(r.error) throw new Error("Kata sandi admin belum cocok.");
    this.sesi = r.data.session;
    this.user = r.data.user;
    return true;
  },
  async keluar(){
    if(DB.siap) await DB.client.auth.signOut();
    this.sesi = null; this.user = null;
  }
};

const Store = {
  async list(){
    if(!DB.siap) return [];
    const resp = await DB.semua("survey_responses", "id,respondent_code,started_at,submitted_at,status,duration_ms,last_sync_at,sync_error_count", q=>q.order("started_at",{ascending:false}));
    const jawab = await DB.semua("survey_answers", "response_id,question_id,answer_value,answer_numeric,answer_text");
    const grup = {};
    jawab.forEach(a=>{ (grup[a.response_id]=grup[a.response_id]||[]).push(a); });

    return resp.map(r=>({
      id: r.id,
      respondent_code: r.respondent_code,
      status: r.status || "draft",
      started_at: r.started_at,
      submitted_at: r.submitted_at,
      last_sync_at: r.last_sync_at,
      sync_error_count: r.sync_error_count || 0,
      data: PETA.keData(grup[r.id]||[]),
      answer_count: (grup[r.id]||[]).length
    }));
  }
};

      <h3>Log Aktivitas Sinkronisasi</h3>
      <div class="tablewrap" style="margin-top:12px">
        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Response ID</th>
              <th>Operasi</th>
              <th>Status</th>
              <th>Detail</th>
            </tr>
          </thead>
          <tbody>
            ${SyncLog.semua().map(l=>`
              <tr>
                <td><small>${tglID(l.waktu)}</small></td>
                <td><code>${(l.responseId||"–").slice(0,8)}</code></td>
                <td>${l.operasi}</td>
                <td><span class="badge ${l.status==='Sukses'?'ok':'bad'}">${l.status}</span></td>
                <td><small>${esc(l.detail)}</small></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
    `;
  },

  attachAdminEvents(){
    Tema.pasang();
    $("#tab-sync").onclick = ()=>{ this.adminTab = "sync"; this.render(); };
    $("#tab-config").onclick = ()=>{ this.adminTab = "config"; this.render(); };
    $("#btn-back-survei").onclick = ()=>{ this.route = "survei"; this.render(); };
    $("#btn-refresh-admin").onclick = async ()=>{
      this.adminRows = await Store.list();
      this.render();
    };

    if($("#btn-save-cfg")){
      $("#btn-save-cfg").onclick = async ()=>{
        const cfg = {
          auto_save_mode: $("#cfg-auto-save").checked,
          auto_retry_mode: $("#cfg-auto-retry").checked,
          auto_retry_interval_sec: Number($("#cfg-retry-interval").value),
          auto_finalize_mode: $("#cfg-auto-finalize").checked
        };
        await AppConfig.save(cfg);
        toast("✓ Pengaturan Auto-Save berhasil disimpan!", "ok");
      };
    }

    if($("#btn-retry-all")){
      $("#btn-retry-all").onclick = async ()=>{
        const ok = await Antrian.alirkan();
        toast(ok ? "✓ Semua antrean tersinkronkan!" : "Sebagian antrean belum tersinkronkan.", ok?"ok":"bad");
        this.adminRows = await Store.list();
        this.render();
      };
    }

    if($("#btn-test-autosave")){
      $("#btn-test-autosave").onclick = async ()=>{         try{           await Respon.pastikanDraft();           Respon.antre("P1", 4, { P1:4 });           toast("✓ Uji Auto-Save berjalan dengan sukses!", "ok");         }catch(e){ toast("Gagal uji Auto-Save: " + e.message, "bad"); }       };     }      $$(".btn-preview-draft").forEach(b=>{
      b.onclick = (e)=>{
        const id = e.target.getAttribute("data-id");
        const r = (this.adminRows||[]).find(x=>x.id===id);
        if(!r) return;
        alert(`Preview Draft ${r.id}:\n` + JSON.stringify(r.data, null, 2));
      };
    });

    $$(".btn-sync-retry").forEach(b=>{
      b.onclick = async (e)=>{
        const id = e.target.getAttribute("data-id");
        toast(`Mencoba sinkronisasi ulang ${id}...`, "ok");
        await Antrian.alirkan();
      };
    });
  }
};

function dekorasi(){
  const host=$("#decor"); if(!host) return; host.innerHTML="";
  const warna=["#C9B5E8","#E8B7CE","#F6D58A","#B7D3B0","#B9D4E8","#F3C9A8"];
  for(let i=0;i<20;i++){
    const d=document.createElement("i");
    d.className="dust"+(i%3===0?" star":"");
    const px=[2,3,4][i%3];
    d.style.cssText="width:"+px+"px;height:"+px+"px;--c:"+warna[i%warna.length]+";"+
      "--d:"+(Math.random()*4.5).toFixed(2)+"s;--dur:"+(3.4+Math.random()*3).toFixed(2)+"s;"+
      "left:"+(2+Math.random()*95).toFixed(1)+"%;top:"+(2+Math.random()*94).toFixed(1)+"%";
    host.appendChild(d);
  }
}

window.addEventListener("DOMContentLoaded", ()=>AppView.init());
</script>
</body>
</html>
